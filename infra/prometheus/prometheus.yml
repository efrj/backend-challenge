global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wagering-processor
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-1:3000
          - app-2:3000
          - app-3:3000

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
