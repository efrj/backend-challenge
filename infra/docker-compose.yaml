name: jungle-wagering-processor

# Hostnames that only exist on the compose network.
# Every other setting is read from ../.env.example (and ../.env when present).
x-app-build: &app-build
  context: ..
  dockerfile: infra/Dockerfile

x-app-env-files: &app-env-files
  - ../.env.example
  - path: ../.env
    required: false

x-app-docker-env: &app-docker-env
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  SQS_ENDPOINT: http://localstack:4566
  WORKERS_ENABLED: "true"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle-wagering-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${DB_USER:-jungle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jungle_secret}
      POSTGRES_DB: ${DB_NAME:-wagering_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jungle} -d ${DB_NAME:-wagering_db}"]
      interval: 3s
      timeout: 3s
      retries: 15

  localstack:
    image: localstack/localstack:3.8
    container_name: jungle-wagering-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      LS_LOG: warn
      SQS_WAGER_QUEUE_NAME: ${SQS_WAGER_QUEUE_NAME:-wager-transactions.fifo}
      SQS_WAGER_DLQ_NAME: ${SQS_WAGER_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-integration-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
      SQS_VISIBILITY_TIMEOUT_SEC: ${SQS_VISIBILITY_TIMEOUT_SEC:-30}
    ports:
      - "${SQS_PORT:-4566}:4566"
    volumes:
      - ./data/localstack:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  app-1:
    build: *app-build
    container_name: jungle-wagering-app-1
    restart: unless-stopped
    env_file: *app-env-files
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      <<: *app-docker-env
      INSTANCE_ID: app-1
      AUTO_MIGRATE: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/health/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-2:
    build: *app-build
    container_name: jungle-wagering-app-2
    restart: unless-stopped
    env_file: *app-env-files
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      app-1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      <<: *app-docker-env
      INSTANCE_ID: app-2
      AUTO_MIGRATE: "false"
    ports:
      - "3001:3000"

  app-3:
    build: *app-build
    container_name: jungle-wagering-app-3
    restart: unless-stopped
    env_file: *app-env-files
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      app-1:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      <<: *app-docker-env
      INSTANCE_ID: app-3
      AUTO_MIGRATE: "false"
    ports:
      - "3002:3000"

  tempo:
    image: grafana/tempo:2.7.2
    container_name: jungle-wagering-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: jungle-wagering-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: jungle-wagering-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.2
    container_name: jungle-wagering-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: wagering-processor
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
      - tempo
